# /etc/park/cloud.conf - step 7 cloud fallback settings (Core1 / park_ui)
#
# ASCII only. Format: key=value, one per line, '#' starts a comment.
# This file is NOT part of the git repository: it holds the API key (P7-07).
# Keep it mode 600 and owned by root:
#     install -d -m 700 /etc/park
#     install -m 600 cloud.conf.example /etc/park/cloud.conf
#
# The LCD settings page (gear button) edits this file atomically and keeps a
# .bak of the previous content, so hand editing is optional.
# Overrides for testing:
#     PARK_CLOUD_CONF=/tmp/cloud.conf        # use another file
#     DEEPSEEK_API_KEY=sk-...                # used when api_key is empty here

# Endpoint (any OpenAI-compatible /chat/completions URL).
# DeepSeek (default):
api_base=https://api.deepseek.com/chat/completions
# Alibaba DashScope / Qwen (通义千问), OpenAI-compatible mode:
#api_base=https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
# OpenAI:
#api_base=https://api.openai.com/v1/chat/completions

# Secret. Leave empty and export DEEPSEEK_API_KEY instead if you prefer.
# NEVER commit a real key. Logs only ever show a mask (sk-abcd...wxyz).
# `api_key` is the ACTIVE key (the one sent with requests). park_ui additionally
# keeps one key per provider in key_<provider>= lines (deepseek / dashscope /
# openai / custom) so switching provider on the LCD also switches the key; the
# settings page writes those lines for you.
api_key=
#key_deepseek=sk-...
#key_dashscope=sk-...
#key_openai=sk-...

# Model name; must match the endpoint above.
#   DeepSeek : deepseek-chat / deepseek-reasoner
#   DashScope: qwen-vl-max (vision) / qwen-plus / qwen-vl-plus
#   OpenAI   : gpt-4o-mini (vision)
# The LCD preset button cycles model+endpoint together.
model=deepseek-chat

prompt=You are a license plate reader. Read the license plate in the image and output ONLY one JSON object: {"plate":"<plate text>","confidence":0.95}. If no plate is readable, output {"plate":"","confidence":0}. No other text.

# Confidence policy (permit no second end-side threshold: Core0 keeps
# conf_threshold in /dev/shm/park_shm; these two only steer the cloud call).
#   trigger_conf: call the cloud when the edge confidence is BELOW this
#   accept_conf : accept the cloud answer when its confidence is >= this
trigger_conf=0.60
accept_conf=0.50

# One request per recognition event: hard timeout + at most 1 retry
# (transport errors only; 4xx/5xx are never retried).
timeout_ms=5000
retry=1

# TLS CA bundle. The board rootfs ships NO ca-certificates.crt (probed
# 2026-09-11), so HTTPS verification needs one of:
#   a) cp <bundle> /etc/park/ca.pem        <- recommended, picked up first
#   b) ca_file=/path/to/bundle.crt
#   c) insecure_tls=1                      (demo only: no verification)
# Empty = auto-detect: /etc/park/ca.pem, then the usual system locations.
# park_ui logs the effective CA path + Qt's SSL library at startup and shows
# both on the settings page ("tls=..." line).
ca_file=

# Proxy. Default is NONE (direct connection): Qt - unlike python - silently
# honours http_proxy/https_proxy from the environment, so a stray proxy left by
# a campus image makes every request burn the full timeout while a direct
# socket still works. Set "env" to follow those variables anyway, or an
# explicit URL (http://host:port).
proxy=

# Transport. auto (default) = Qt Network first, and if Qt cannot complete the
# request (this board's Qt 5.12 + OpenSSL 1.1.1 stalls on TLS 1.3 while python3
# gets HTTP 200 in ~1 s), fall back to a python3 child process and stay there.
# qt     = never fall back;  python = always use python3 (skips the 5 s probe).
transport=auto

# Behaviour switches (0/1)
auto_fallback=1
writeback=1
insecure_tls=0
fake_result=0
