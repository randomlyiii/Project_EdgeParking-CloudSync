# /etc/wpa_supplicant.conf - SAMPLE / TEMPLATE (safe to commit)
#
# Deploy as /etc/wpa_supplicant.conf on the board (root:root, mode 600):
#     install -m 600 sample_wpa_supplicant.conf /etc/wpa_supplicant.conf
#
# The LCD settings page (gear -> Network tab) writes that file for you: it keeps
# the three global options below, backs the old file up to
# /etc/wpa_supplicant.conf.bak, and rolls back automatically if no IPv4 lease
# arrives within 20 s. Hand editing works too:
#     ip link set wlan0 up
#     wpa_supplicant -B -D nl80211 -i wlan0 -c /etc/wpa_supplicant.conf
#     udhcpc -i wlan0 -n -q -t 5 -T 3
#
# NEVER commit the real file and NEVER fill this sample in: it is the only file
# in the project that carries the WiFi password (PSK). The placeholders below
# are intentionally unusable as-is.

ctrl_interface=/var/run/wpa_supplicant
update_config=1
ap_scan=1

network={
    # SSID may be non-ASCII (UTF-8) but must be quoted. Backslash and double
    # quote inside it would need escaping.
    ssid="YOUR_SSID"
    # WPA2 passphrase: 8..63 printable ASCII characters, or a 64-hex PSK.
    psk="YOUR_PASSWORD"
    # Omit psk/key_mgmt entirely for an open network (key_mgmt=NONE).
    key_mgmt=WPA-PSK
}
